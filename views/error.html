<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Dish and ingredient action confirmation" />
    <title>Error - Diamond is Unbreakable</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/menu.css" rel="stylesheet" />
</head>

<body>
    {{> headermenus}}

    <section class="menu-hero-sample" aria-labelledby="confirmation-title">
        <div class="container menu-hero-content">
            <p class="menu-eyebrow">Fresh from Tonio's kitchen</p>
            <h1 id="confirmation-title" class="mb-0">ERROR</h1>
        </div>
    </section>

    <main class="menu-page">
        <div class="container menu-content">
            <section class="text-center py-5">
                <h2 class="section-heading mb-4">
                    <span class="section-heading-upper">The operation could not be completed</span>
                </h2>
                <p class="mb-5">{{errorMessage}}</p>
                {{#returnUrl}}
                <a class="btn btn-primary btn-lg" href="{{returnUrl}}">{{returnLabel}}</a>
                {{/returnUrl}}
                {{^returnUrl}}{{#dishId}}
                <a class="btn btn-primary btn-lg" href="/show_dish?dishId={{dishId}}">Return to the dish</a>
                {{/dishId}}{{^dishId}}
                <a class="btn btn-primary btn-lg" href="/">Return to the menu</a>
                {{/dishId}}{{/returnUrl}}
            </section>
        </div>
    </main>

    {{>footer}}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/scripts.js"></script>
</body>

</html>
