<header>
  <h1 class="site-heading text-center text-faded d-none d-lg-block">
    <span class="site-heading-upper text-primary mb-3">Trattoria Restaurant</span>
    <span class="site-heading-lower">Diamond is Unbreakable</span>
  </h1>
</header>
<nav class="navbar navbar-expand-lg navbar-dark py-lg-4" id="mainNav">
  <div class="container">
    <a class="navbar-brand text-uppercase fw-bold d-lg-none" href="/">Tonio's</a>

      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

        </li>
      </ul>
      {{#showNewDish}}

        <li class="nav-item px-lg-4 btn btn-primary"><a class="nav-link text-uppercase" href="/new_dish">NEW DISH</a></li>
